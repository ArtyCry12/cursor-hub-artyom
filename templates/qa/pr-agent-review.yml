name: Optional PR-Agent review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-agent:
    # Copy this file into a project only after the project owner approves
    # provider usage, secrets, and the bounded pilot.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Review pull request
        uses: the-pr-agent/pr-agent@f3b385ea2927247ddcff2fe252472380b9c8f5fc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER__API_BASE: https://openrouter.ai/api/v1
          # Use the provider prefix required by LiteLLM/PR-Agent.
          # Refresh this R3 fallback against the live router before adoption.
          CONFIG__MODEL: openrouter/inclusionai/ling-3.0-flash-sante:free
          CONFIG__FALLBACK_MODELS: "[]"
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "4096"
          CONFIG__MAX_MODEL_TOKENS: "4096"
          # Keep review advisory. Do not enable auto-improve or auto-merge.
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"
          PR_REVIEWER__REQUIRE_SECURITY_REVIEW: "true"
